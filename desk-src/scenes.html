<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="led.js"></script>
<script src="data/teams.js"></script>
<script src="data/facts.js"></script>
<style>
/* Vertical video scenes, 1080×1920. Each scene draws frame t from t alone (renderFrame).
   Safe zone for TikTok/Reels/Shorts: key text between y 190 and 1540, the lower right kept clear. */
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
#cv, #fx, #top { position: absolute; left: 0; top: 0; }
#dom, #endl { position: absolute; inset: 0; }
#cv { z-index: 0; } #dom { z-index: 1; } #top { z-index: 2; } #endl { z-index: 3; } #fx { z-index: 4; }
.x { position: absolute; transform-origin: 50% 50%; }
.eb { font: 600 30px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
.eb .r { color: var(--ink4); }
.hd { font: 900 96px/0.98 var(--display); color: var(--ink); letter-spacing: -.01em; }
.hd em { font-style: normal; color: var(--amber); }
.bd { font: 500 40px/1.34 var(--body); color: var(--ink2); }
.bd b { color: var(--ink); font-weight: 700; }
.pill { display: inline-block; background: var(--amber); color: var(--onAmber); font: 700 34px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 26px 34px; }
.rule2 { border-top: 5px solid var(--ink); border-bottom: 2px solid var(--ink); height: 12px; }
.glass { background: var(--glass); border: 2px solid var(--glassRule); }
.tab { font: 900 150px/0.88 var(--tabloid); letter-spacing: -.035em; text-transform: uppercase; color: var(--dayInk); }
.stamp { font: 900 110px/1 var(--display); padding: 18px 34px 24px; border: 11px solid currentColor; text-transform: uppercase; }
</style></head>
<body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas><div id="dom"></div><canvas id="top" width="1080" height="1920"></canvas><div id="endl"></div><canvas id="fx" width="1080" height="1920"></canvas></div>
<script>
const Q = new URLSearchParams(location.search);
document.documentElement.lang = Q.get("lang") === "tr" ? "tr" : "en";
const lang = Q.get("lang") || "en", tr = lang === "tr";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const fx = document.getElementById("fx"), fxx = fx.getContext("2d");
const dom = document.getElementById("dom"), stage = document.getElementById("stage");
const topc = document.getElementById("top"), tx = topc.getContext("2d"), endl = document.getElementById("endl");
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nfmt = (n) => (tr ? Math.round(n).toLocaleString("tr-TR") : Math.round(n).toLocaleString("en-US"));
function el(html, parent = dom) { const d = document.createElement("div"); d.innerHTML = html.trim(); const e = d.firstElementChild; parent.appendChild(e); return e; }
function vis(e, o, dy = 0, s = 1, rot = 0, dx = 0) { e.style.opacity = o; e.style.transform = `translate(${dx}px, ${dy}px) scale(${s}) rotate(${rot}deg)`; }
function rise(e, t, a, dur = 0.45, dist = 40) { const k = eo(seg(t, a, a + dur)); vis(e, k, (1 - k) * dist); }
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function dot(c, x, y, r, color) { c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
function glowDots(c, pts, r, color, blur) { c.save(); c.shadowColor = color; c.shadowBlur = blur; c.fillStyle = color; for (const [x, y, a] of pts) { c.globalAlpha = a ?? 1; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); } c.restore(); }
/** An LED readout centred on (cx, cy) at a pitch. */
function ledAt(c, text, cx, cy, pitch, o = {}) { const w = (LED.cols(text) - 1) * pitch; return LED.draw(c, text, cx - w / 2, cy - 3 * pitch, { pitch, off: o.off ?? null, on: o.on, glow: o.glow ?? pitch * 0.9, alpha: o.alpha, lit: o.lit, r: o.r }); }

// ── the end card, shared by every scene ───────────────────────────────────
const END = { dur: 1.7 };
function buildEnd() {
  const e = el(`<div class="x" style="inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:980px;gap:34px;text-align:center">
    <div style="font:900 170px/0.9 var(--display);color:var(--ink)">Clutch</div>
    <div style="font:900 62px/1.05 var(--display);color:var(--ink)">${tr ? "Her maçı tahmin et. <em style='font-style:normal;color:var(--amber)'>Clutch'ı yen.</em>" : "Call every game. <em style='font-style:normal;color:var(--amber)'>Beat Clutch.</em>"}</div>
    <div class="pill" style="margin-top:26px">${tr ? "App Store'da ücretsiz" : "Free on the App Store"}</div>
    <div class="eb" style="color:var(--ink3);margin-top:8px">@getclutchledger</div></div>`, endl);
  return e;
}
const C_DOTS = [[1, 0], [2, 0], [3, 0], [0, 1], [0, 2], [0, 3], [1, 4], [2, 4], [3, 4]];
function drawEnd(t, t0, e) {
  const k = seg(t, t0, t0 + 0.22);
  e.style.opacity = k; e.style.transform = `translateY(${(1 - eo(k)) * 30}px)`;
  fxx.clearRect(0, 0, W, H);
  if (t < t0) return;
  const pitch = 86, r = 32, ox = 540 - 1.5 * pitch - 26, oy = 470;
  fxx.globalAlpha = k;
  for (let gx = -3; gx <= 7; gx++) for (let gy = -1; gy <= 5; gy++) dot(fxx, ox + gx * pitch, oy + gy * pitch, 7, "rgba(241,233,216,0.07)");
  const pts = C_DOTS.map(([cx, cy], i) => [ox + cx * pitch, oy + cy * pitch, clamp((t - t0 - 0.12 - i * 0.045) / 0.12)]);
  glowDots(fxx, pts, r, "#FFB020", 38);
  fxx.globalAlpha = 1;
}

// ── scenes ────────────────────────────────────────────────────────────────
const S = {};

/* sim2000 — the real 2,000 games the phone plays for the demo game, dropped like a Galton board. */
S.sim2000 = () => {
  const DUR = 15.2, T_END = 13.5;
  const home = SIM.home, away = SIM.away, N = home.length;
  const hAbbr = SIM.home_abbr, aAbbr = SIM.away_abbr;
  const hName = SIM.home_name, aName = SIM.away_name;
  const eb = el(`<div class="x eb" style="left:70px;right:70px;top:200px;display:flex;justify-content:space-between"><span>${tr ? "Örnek maç" : "Example game"}</span><span class="r">${tr ? "Simülasyon" : "The simulation"}</span></div>`);
  const rl = el(`<div class="x rule2" style="left:70px;right:70px;top:252px"></div>`);
  const h1 = el(`<div class="x hd" style="left:70px;right:70px;top:300px;font-size:92px">${tr ? `Telefonum ${aName}–${hName} maçını <em>2.000 kez oynadı.</em>` : `My phone just played ${aName} at ${hName} <em>2,000 times.</em>`}</div>`);
  const h2 = el(`<div class="x hd" style="left:70px;right:70px;top:300px;font-size:92px;opacity:0">${tr ? `${hName} <em>2.000 maçın ${nfmt(SIM.home.filter((h, i) => h > SIM.away[i]).length)}'ini</em> kazandı.` : `${hName} won <em>${nfmt(SIM.home.filter((h, i) => h > SIM.away[i]).length)} of 2,000.</em>`}</div>`);
  const lab = el(`<div class="x eb" style="left:70px;right:70px;top:1540px;display:flex;justify-content:space-between;color:var(--ink3);font-size:26px"><span>← ${aAbbr} ${tr ? "kazanır" : "wins"}</span><span>${tr ? "fark" : "margin"}</span><span>${hAbbr} ${tr ? "kazanır" : "wins"} →</span></div>`);
  const cap = el(`<div class="x bd" style="left:70px;right:70px;top:1596px;font-size:34px;opacity:0">${tr ? "Her hücum, her şut, her top kaybı. Telefonunda, yaklaşık iki saniyede." : "Every possession, every shot, every turnover. On your phone, in about two seconds."}</div>`);
  const end = buildEnd();
  // bins: margin −36…+36, 2 points wide, 3 dots across
  const B0 = -36, BW = 2, NB = 36, X0 = 90, BINW = 25, BASE = 1500, P = 8, R = 3.1;
  const binOf = (m) => clamp(Math.floor((m - B0) / BW), 0, NB - 1);
  const binX = (b) => X0 + b * BINW + 4.5;
  const rand = rng(20261020);
  const dots = [];
  for (let i = 0; i < N; i++) {
    const m = home[i] - away[i];
    const rel = i < 14 ? 0.55 + i * 0.16 : 2.8 + 6.6 * Math.pow((i - 14) / (N - 15), 0.78);
    const fall = i < 14 ? 1.15 : 0.78;
    const b = binOf(m);
    const bx = X0 + b * BINW + BINW / 2;
    const rows = 8, noise = [];
    for (let k = 0; k <= rows; k++) noise.push((rand() * 2 - 1) * 20 * Math.sin((Math.PI * k) / rows));
    dots.push({ m, b, rel, land: rel + fall, fall, bx, noise, home: m > 0 });
  }
  const order = dots.slice().sort((a, b) => a.land - b.land);
  const fill = new Array(NB).fill(0);
  for (const d of order) { d.j = fill[d.b]++; d.sx = binX(d.b) + (d.j % 3) * P; d.sy = BASE - 4 - Math.floor(d.j / 3) * P; }
  const hist = document.createElement("canvas"); hist.width = W; hist.height = H; const hx = hist.getContext("2d");
  const pegs = [];
  for (let k = 0; k < 8; k++) { const y = 896 + k * 28, half = 26 + k * 52; for (let x = -half; x <= half + 0.1; x += 52) pegs.push([540 + x, y]); }
  function pathAt(d, u) {
    // u 0..1 over the fall: 0–0.62 through the pegs (8 hops), then a straight drop to the stack
    const rows = 8, split = 0.62;
    if (u < split) {
      const v = u / split, k = Math.min(rows - 1, Math.floor(v * rows)), f = v * rows - k;
      const xa = lerp(540, d.bx, k / rows) + d.noise[k], xb = lerp(540, d.bx, (k + 1) / rows) + d.noise[k + 1];
      const ya = 868 + k * 28, yb = 868 + (k + 1) * 28;
      return [lerp(xa, xb, f), lerp(ya, yb, f) - Math.sin(Math.PI * f) * 12];
    }
    const v = (u - split) / (1 - split);
    return [lerp(d.bx, d.sx, v), lerp(1092, d.sy, v * v)];
  }
  window.DURATION = DUR;
  return (t) => {
    ctx.clearRect(0, 0, W, H); hx.clearRect(0, 0, W, H);
    for (const [x, y] of pegs) dot(ctx, x, y, 4.2, "#3A342B");
    ctx.fillStyle = "rgba(241,233,216,0.28)"; ctx.fillRect(X0 + 18 * BINW - 1, BASE - 380, 2, 392);
    ctx.fillStyle = "rgba(241,233,216,0.22)"; ctx.fillRect(X0, BASE + 4, NB * BINW, 2);
    let landed = 0, lh = 0;
    const flying = [];
    for (const d of dots) {
      if (t >= d.land) { landed++; if (d.home) lh++; dot(hx, d.sx, d.sy, R, d.home ? "#FFB020" : "#E9DFCB"); }
      else if (t >= d.rel) { const [x, y] = pathAt(d, (t - d.rel) / d.fall); flying.push([x, y, d.home]); }
    }
    ctx.save(); ctx.filter = "blur(7px)"; ctx.globalAlpha = 0.55; ctx.drawImage(hist, 0, 0); ctx.restore();
    ctx.drawImage(hist, 0, 0);
    glowDots(ctx, flying.filter((f) => f[2]).map(([x, y]) => [x, y]), 5, "#FFB020", 16);
    glowDots(ctx, flying.filter((f) => !f[2]).map(([x, y]) => [x, y]), 5, "#F1E9D8", 10);
    // counters: games played (LED), then the reveal
    const out = seg(t, 10.7, 11.0), reveal = seg(t, 11.0, 11.45);
    const games = String(landed).padStart(4, "0");
    if (out < 1) {
      ledAt(ctx, games, 540, 690, 15, { on: "#F1E9D8", glow: 10, alpha: 1 - out });
      ctx.save(); ctx.globalAlpha = 1 - out;
      ctx.font = "600 26px 'Plex Mono'"; ctx.fillStyle = "#B4AA97"; ctx.textAlign = "center";
      ctx.fillText(tr ? `${aAbbr} ${nfmt(landed - lh)}  ·  OYNANAN  ·  ${hAbbr} ${nfmt(lh)}` : `${aAbbr} ${nfmt(landed - lh)}  ·  GAMES PLAYED  ·  ${hAbbr} ${nfmt(lh)}`, 540, 800);
      ctx.restore();
    }
    if (reveal > 0) ledAt(ctx, Math.round((lh / N) * 100) + "%", 540, 700, 22, { alpha: reveal, glow: 22 });
    vis(h1, 1 - reveal); vis(h2, reveal, (1 - reveal) * 20);
    vis(cap, eo(seg(t, 11.6, 12.1)), (1 - eo(seg(t, 11.6, 12.1))) * 20);
    vis(eb, 1); vis(rl, 1); vis(lab, 1);
    drawEnd(t, T_END, end);
  };
};

/* stoppress — What-If: the star sits, the number falls. Demo game, labelled as an example. */
S.stoppress = () => {
  const DUR = 10.4, T_END = 8.7;
  const from = +(Q.get("from") || 58), to = +(Q.get("to") || 43);
  const who = Q.get("who") || "Dončić", team = Q.get("team") || "Lakers", opp = Q.get("opp") || "Celtics";
  const band = el(`<div class="x" style="left:0;right:0;top:188px;height:78px;background:var(--glass);border-top:2px solid var(--glassRule);border-bottom:2px solid var(--glassRule);overflow:hidden;display:flex;align-items:center">
    <div style="background:var(--amber);color:var(--onAmber);font:700 32px/1 var(--mono);letter-spacing:.14em;padding:22px 22px;flex:none;position:relative;z-index:2">STOP PRESS</div>
    <div id="tick" style="white-space:nowrap;font:700 32px/1 var(--mono);letter-spacing:.12em;color:var(--hot);padding-left:30px"></div></div>`);
  const tick = band.querySelector("#tick");
  const tickText = (tr ? `${who.toUpperCase()} OYNAMIYOR · ${team.toUpperCase()} – ${opp.toUpperCase()} · ÖRNEK MAÇ · ` : `${who.toUpperCase()} IS OUT · ${opp.toUpperCase()} AT ${team.toUpperCase()} · EXAMPLE GAME · `).repeat(4);
  tick.textContent = tickText;
  const h1 = el(`<div class="x hd" style="left:70px;right:70px;top:330px;font-size:118px">${tr ? `${esc(who)} oynamıyor.` : `${esc(who)} sits.`}</div>`);
  const h2 = el(`<div class="x hd" style="left:70px;right:40px;top:462px;font-size:80px;white-space:nowrap"><em>${tr ? `${esc(team)} düşüşte.` : `Watch the ${esc(team)} fall.`}</em></div>`);
  const glass = el(`<div class="x glass" style="left:70px;right:70px;top:640px;height:430px"></div>`);
  const lbl = el(`<div class="x eb" style="left:106px;top:672px;color:var(--ink3);font-size:26px">${tr ? `${esc(team)} · bu gece kazanma şansı` : `${esc(team)} · chance to win tonight`}</div>`);
  const bar = el(`<div class="x" style="left:70px;right:70px;top:1100px;height:34px;background:#E9DFCB"><div id="bf" style="height:100%;background:var(--amber);width:${from}%"></div></div>`);
  const barL = el(`<div class="x eb" style="left:70px;right:70px;top:1150px;display:flex;justify-content:space-between;font-size:26px;color:var(--ink3)"><span id="bl"></span><span id="br"></span></div>`);
  const chips = el(`<div class="x" style="left:70px;right:70px;top:1216px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px"></div>`);
  const players = (Q.get("players") || "James,Reaves").split(",");
  [[who, true], ...players.map((p) => [p, false])].forEach(([p, out]) => chips.appendChild(el(`<div style="border:2px solid ${out ? "var(--hot)" : "var(--ruleBold)"};padding:18px 18px 16px"><div style="font:800 34px/1 var(--body);color:var(--ink)">${esc(p)}</div><div class="eb" data-out="${out ? 1 : 0}" style="font-size:22px;margin-top:10px;color:${out ? "var(--hot)" : "var(--ink3)"}">${tr ? (out ? "OYNAMIYOR" : "OYNUYOR") : out ? "SITS" : "PLAYS"}</div></div>`, chips)));
  const f1 = el(`<div class="x bd" style="left:70px;right:70px;top:1380px;font-size:36px">${tr ? "What-If'teki her kaldıraç <b>3.678 gerçek maçta ölçüldü.</b> Tahmin değil, ölçüm." : "Every What-If lever is <b>measured on 3,678 real games.</b> Not guessed."}</div>`);
  const end = buildEnd();
  window.DURATION = DUR;
  return (t) => {
    ctx.clearRect(0, 0, W, H);
    tick.style.transform = `translateX(${-t * 190}px)`;
    const roll = seg(t, 1.9, 3.5);
    const steps = Math.round(lerp(from, to, eio(roll)));
    const flick = roll > 0 && roll < 1 && Math.floor(t * 30) % 3 === 0;
    const hotFlash = seg(t, 3.5, 3.6) * (1 - seg(t, 3.9, 4.4));
    LED.field(tx, 92, 720, 896, 330, 18, "rgba(241,233,216,0.06)", 1.7);
    ledAt(tx, `${steps}%`, 540, 890, 36, { on: hotFlash > 0.02 ? "#FF6B5A" : "#FFB020", glow: flick ? 50 : 32, off: "#221E18" });
    document.getElementById("bf").style.width = `${steps}%`;
    document.getElementById("bl").textContent = `${team.toUpperCase()} ${steps}%`;
    document.getElementById("br").textContent = `${opp.toUpperCase()} ${100 - steps}%`;
    const outChip = chips.firstElementChild, outLab = outChip.querySelector("[data-out]");
    const kOut = seg(t, 1.2, 1.5), isOut = t >= 1.2;
    outChip.style.borderColor = isOut ? "var(--hot)" : "var(--ruleBold)";
    outLab.textContent = tr ? (isOut ? "OYNAMIYOR" : "OYNUYOR") : isOut ? "SITS" : "PLAYS";
    outLab.style.color = isOut ? "var(--hot)" : "var(--ink3)";
    outChip.style.transform = `scale(${1 + 0.1 * Math.sin(Math.PI * kOut)})`;
    vis(h1, 1); vis(h2, 1); vis(glass, 1); vis(lbl, 1); vis(bar, 1); vis(barL, 1); vis(chips, 1);
    rise(f1, t, 4.3);
    drawEnd(t, T_END, end);
  };
};

/* receipt — a slate's seal prints out of the slot, then the stamp. */
S.receipt = () => {
  const DUR = 10.6, T_END = 8.9;
  const games = JSON.parse(Q.get("games") || '[["BOS @ LAL","LAL 58.0%"],["NYK @ MIL","NYK 64.2%"],["OKC @ DEN","OKC 55.1%"],["HOU @ SAS","SAS 61.7%"],["PHI @ ORL","ORL 52.3%"]]');
  const kind = Q.get("kind") || (tr ? "ÖRNEK · MÜHÜR" : "SAMPLE · SEAL");
  const lines = [
    ["CLUTCH · THE BASKETBALL LEDGER", "", "c"],
    [`${kind} · ${Q.get("slate") || "SLATE 2026-10-22"}`, "", "c2"],
    ["—", "", "hr"],
    ...games.map((g) => [g[0], g[1], ""]),
    ["—", "", "hr"],
    [tr ? "MÜHÜR" : "SEALED", Q.get("at") || (tr ? "13:22 ET · İLK HÜCUMA 4S 10DK" : "13:22 ET · 4H 10M TO TIP"), ""],
    ["SHA-256", Q.get("sha") || "9f3a41d2…c21e07", ""],
    [tr ? "ÖNCEKİ" : "PREV", Q.get("prev") || "71c0d2aa…e9aa31", ""],
    ["REPO", "clutch-receipts", ""],
  ];
  const h1 = el(`<div class="x hd" style="left:70px;right:70px;top:220px;font-size:112px">${tr ? "Clutch <em>fişini saklar.</em>" : "Clutch <em>keeps receipts.</em>"}</div>`);
  const slot = el(`<div class="x" style="left:70px;right:70px;top:520px;height:30px;background:#050505;border-radius:15px;box-shadow:0 0 0 6px #26221C, 0 18px 40px rgba(0,0,0,.6);z-index:3"></div>`);
  const slipWrap = el(`<div class="x" style="left:110px;right:110px;top:535px;height:0;overflow:hidden;z-index:2;padding-bottom:18px"></div>`);
  const slip = el(`<div style="position:absolute;left:0;right:0;top:0;background:var(--slip);color:var(--slipInk);padding:40px 40px 46px;font:600 29px/45px var(--mono)"></div>`, slipWrap);
  lines.forEach(([a, b, k]) => {
    if (k === "hr") slip.appendChild(el(`<div style="border-top:3px dashed rgba(27,26,23,.5);margin:18px 0 20px"></div>`, slip));
    else if (k === "c" || k === "c2") slip.appendChild(el(`<div style="text-align:center;font-weight:${k === "c" ? 700 : 500};letter-spacing:${k === "c" ? ".1em" : ".04em"};opacity:${k === "c" ? 1 : 0.75}">${esc(a)}</div>`, slip));
    else slip.appendChild(el(`<div style="display:flex;justify-content:space-between;gap:20px"><span>${esc(a)}</span><span style="font-weight:700;text-align:right">${esc(b)}</span></div>`, slip));
  });
  slip.appendChild(el(`<div style="position:absolute;left:0;right:0;bottom:-16px;height:16px;background:linear-gradient(45deg,transparent 11px,var(--slip) 0) 0 0/22px 22px,linear-gradient(-45deg,transparent 11px,var(--slip) 0) 0 0/22px 22px"></div>`, slip));
  const stamp = el(`<div class="x stamp" style="left:560px;top:${Q.get("sty") || 1086}px;color:#1E7A45;font-size:66px;z-index:4;border-width:8px;padding:12px 24px 16px">${tr ? "Mühürlü ✓" : "Sealed ✓"}</div>`);
  const f1 = el(`<div class="x bd" style="left:70px;right:70px;top:${Q.get("fy") || 1356}px;font-size:38px">${tr ? "Maç başlamadan herkese açık bir GitHub deposuna yazılır. <b>Sonradan kimse değiştiremez. Biz de.</b>" : "Committed to a public GitHub repo before tip. <b>Nobody can change it after. Not even us.</b>"}</div>`);
  const end = buildEnd();
  let full = 0;
  window.DURATION = DUR;

        const n = stats[i][0], k = eo(seg(t, a, a + 1.2));
        let shown = n;
        if (/^\d+$/.test(n)) shown = Math.round(+n * k).toLocaleString(tr ? "tr-TR" : "en-US");
        else if (n === "100K") shown = Math.round(100 * k) + "K";
        ledAt(tx, shown, r.left + r.width / 2, r.top + 125, 16, { glow: 16, alpha: (1 - gOut) * eo(seg(t, a, a + 0.35)) });
      });
    }
    const si = clamp(Math.floor((t - 5.3) / 1.2), 0, 3);
    const inPh = seg(t, 5.3, 5.6) * (1 - seg(t, 10.1, 10.4));
    phone.style.opacity = inPh; phone.style.transform = `translateY(${(1 - eo(seg(t, 5.3, 5.7))) * 80}px)`;
    const img = document.getElementById("ph"); if (img.getAttribute("src") !== shots[si][0]) img.setAttribute("src", shots[si][0]);
    pcap.textContent = shots[si][1]; pcap.style.opacity = inPh; pcap.style.top = "640px";
    rise(f1, t, 10.4);
    drawEnd(t, T_END, end);
  };
};


/* buzzer — the real court footage (simulator recording), cut with two slow-motion swishes. */
S.buzzer = () => {
  const DUR = 8.5, T_END = 6.8;
  // output time → source time: [out0, out1, src0, src1]
  const MAP = [[0, 0.9, 0, 0.9], [0.9, 2.65, 0.9, 1.6], [2.65, 3.25, 1.6, 2.8], [3.25, 4.35, 2.8, 3.9], [4.35, 6.1, 3.9, 4.6], [6.1, 6.8, 4.6, 5.3]];
  const src = (t) => { for (const [a, b, c, d] of MAP) if (t < b) return c + ((t - a) / (b - a)) * (d - c); return 5.3; };
  const slow = (t) => (t >= 0.9 && t < 2.65) || (t >= 4.35 && t < 6.1);
  el(`<div class="x eb" style="left:70px;right:70px;top:190px;display:flex;justify-content:space-between"><span>${tr ? "Saha · Clutch" : "The court · Clutch"}</span><span class="r">${tr ? "Gerçek oyun kaydı" : "Real gameplay"}</span></div>`);
  const h1 = el(`<div class="x hd" style="left:70px;right:70px;top:246px;font-size:86px">${tr ? "Yukarı fiske. <em>Swish.</em>" : "Flick it up. <em>Swish.</em>"}</div>`);
  const h2 = el(`<div class="x hd" style="left:70px;right:70px;top:246px;font-size:86px;opacity:0">${tr ? "Beşini de <em>atabilir misin?</em>" : "Can you hit <em>all five?</em>"}</div>`);
  const frame = el(`<div class="x" style="left:90px;top:400px;width:900px;height:1324px;overflow:hidden;border:2px solid var(--glassRule)"><video id="v" src="src/buzzer90.mp4" muted playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;display:block"></video></div>`);
  const chip = el(`<div class="x eb" style="left:120px;top:430px;background:var(--amber);color:var(--onAmber);padding:12px 16px;font-size:24px;opacity:0">${tr ? "Ağır çekim" : "Slow-mo"}</div>`);
  const foot = el(`<div class="x bd" style="left:70px;right:70px;top:1750px;font-size:32px;opacity:0">${tr ? "Daily Spot: herkese aynı beş top, günde bir kez." : "Daily Spot: the same five balls for everyone, once a day."}</div>`);
  const end = buildEnd();
  const v = frame.querySelector("#v");
  window.DURATION = DUR;
  window.READY = () => new Promise((r) => { if (v.readyState >= 2) r(); else v.addEventListener("loadeddata", r, { once: true }); });
  return (t) => {
    ctx.clearRect(0, 0, W, H);
    const flip = eo(seg(t, 5.9, 6.3));
    vis(h1, 1 - flip); vis(h2, flip, (1 - flip) * 20);
    chip.style.opacity = slow(t) ? 1 : 0;
    rise(foot, t, 6.0);
    drawEnd(t, T_END, end);
    const want = Math.min(src(t), v.duration - 0.02);
    if (Math.abs(v.currentTime - want) < 0.001) return;
    return new Promise((r) => { v.addEventListener("seeked", () => r(), { once: true }); v.currentTime = want; });
  };
};

const scene = (S[Q.get("s") || "sim2000"] || S.sim2000)();
window.renderFrame = (t) => { tx.clearRect(0, 0, W, H); tx.globalAlpha = 1; const r = scene(t); return Promise.resolve(r).then(() => window.__img()); };
window.__img = () => Promise.all(Array.from(document.images).filter((i) => i.src && !i.complete).map((i) => new Promise((r) => { i.onload = i.onerror = r; })));
const FACES = ["900 40px Fraunces", "600 26px 'Plex Mono'", "700 26px 'Plex Mono'", "500 30px Franklin", "700 30px Franklin", "800 30px Franklin", "900 30px Franklin"];
