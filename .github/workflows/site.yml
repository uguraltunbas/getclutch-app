# clutchledger.com — the public website, rebuilt from public data and
# deployed to Cloudflare (Workers Static Assets, wrangler.jsonc).
# The GitHub Pages site and the desk (desk.yml) are separate and unchanged.
#
# When: every push to main, four times a day — after the morning seal
# (10:30 UTC), before the first tips (16:00), during games (22:30), after
# the finals (04:30) — and by hand (an ET date to build for, optional).
# A build that fails a check (a betting word, a duplicate title, a page or
# the stylesheet over budget, a data read failing) stops here and the last
# deploy stays up. Without CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# the site is built and checked, kept as an artifact, and not deployed.
name: Website (clutchledger.com)
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 10 * * *"
    - cron: "0 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "ET date to build for (YYYY-MM-DD, empty = today)"
        required: false
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_DATE: ${{ github.event.inputs.date }}
        run: node site-src/build.mjs --out _site_v2
      - name: Cloudflare credentials?
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret: built and checked, not deployed."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site_v2
          retention-days: 7
      - name: Deploy the site
        if: steps.cf.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Deploy the www redirect
        if: steps.cf.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config site-src/www/wrangler.jsonc
